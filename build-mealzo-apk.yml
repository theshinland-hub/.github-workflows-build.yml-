name: Build Mealzo Diary APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MealzoAndroidProject.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Mealzo Android project
        run: unzip -q MealzoAndroidProject.zip -d source

      - name: Install Gradle and build APK
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle -p source/MealzoAndroid :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mealzo-Diary-APK
          path: source/MealzoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
